[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dh-builder-lib"
version = "0.1.0"
description = "Docker executor for on-demand DataHarmonizer bundle rebuilds."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "MIMICC contributors" }
]

[tool.setuptools.packages.find]
include = ["dh_builder_lib*"]
